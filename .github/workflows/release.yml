name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (.deb + tarball)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgdk-pixbuf-2.0-dev \
            libpango1.0-dev libcairo2-dev libglib2.0-dev liblzma-dev libbz2-dev \
            desktop-file-utils shared-mime-info

      - name: Build (release)
        working-directory: rust
        run: cargo build --release

      - name: Run tests
        working-directory: rust
        run: cargo test --release

      - name: Build .deb with cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: cargo deb
        working-directory: rust
        run: cargo deb

      - name: Create standalone tarball
        working-directory: rust
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist/tar
          cp target/release/mcomix-rs dist/tar/
          (cd dist/tar && tar czf "../mcomix-rs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" mcomix-rs)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            rust/target/debian/*.deb
            rust/dist/*.tar.gz

  appimage:
    name: AppImage (Linux standalone)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgdk-pixbuf-2.0-dev             libpango1.0-dev libcairo2-dev libglib2.0-dev liblzma-dev libbz2-dev             desktop-file-utils file curl

      - name: Build AppImage
        working-directory: rust
        run: bash packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: rust/dist/*.AppImage

  windows-cross:
    name: Windows (cross-compiled from Linux: zip + NSIS installer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis zip zstd curl pkg-config

      - name: Cross-compile + bundle + installer
        working-directory: rust
        run: bash packaging/windows/cross-build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            rust/dist/*.zip
            rust/dist/*.exe

  release:
    name: Publish GitHub Release
    needs: [linux, appimage, windows-cross]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
